daemon off;
master_process off;
worker_processes 1;
pid nginx.pid;
error_log error.log notice;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;
    server {
        listen 127.0.0.1:18080;
        location /ping { default_type text/plain; return 200 "pong tengine"; }
        location /redir { return 302 /ping; }
        location /sum {
            default_type text/plain;
            set $answer "v=$arg_a-$arg_b";
            return 200 $answer;
        }
    }
}
